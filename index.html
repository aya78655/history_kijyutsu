<title>歴史ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f1eee4;
    --surface: #fbfaf5;
    --surface-2: #e9e3d3;
    --ink: #2a2823;
    --ink-soft: #6b6559;
    --ink-faint: #948d7c;
    --border: #d9d2bf;
    --accent: #1f5c73;
    --accent-ink: #fbfaf5;
    --accent-soft: #dbe9eb;
    --contour: #8a5a34;
    --correct: #3f7d53;
    --correct-soft: #e1eee3;
    --incorrect: #b8503e;
    --incorrect-soft: #f5e2de;
    --shadow: 0 1px 2px rgba(42,40,35,0.06), 0 8px 24px -12px rgba(42,40,35,0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191b19;
      --surface: #232522;
      --surface-2: #2c2e29;
      --ink: #ece7da;
      --ink-soft: #aca595;
      --ink-faint: #7d7768;
      --border: #3a3c36;
      --accent: #64acc2;
      --accent-ink: #0d1b1e;
      --accent-soft: #223438;
      --contour: #cd9563;
      --correct: #74c28b;
      --correct-soft: #1f2e22;
      --incorrect: #e08e77;
      --incorrect-soft: #33211c;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg: #191b19;
    --surface: #232522;
    --surface-2: #2c2e29;
    --ink: #ece7da;
    --ink-soft: #aca595;
    --ink-faint: #7d7768;
    --border: #3a3c36;
    --accent: #64acc2;
    --accent-ink: #0d1b1e;
    --accent-soft: #223438;
    --contour: #cd9563;
    --correct: #74c28b;
    --correct-soft: #1f2e22;
    --incorrect: #e08e77;
    --incorrect-soft: #33211c;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.7;
    min-height: 100vh;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 4rem;
  }

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.75rem;
  }

  .masthead h1 {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: 1.375rem;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--contour);
  }

  .masthead .subtitle {
    font-size: 0.8125rem;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
  }

  /* ---- progress trail ---- */
  .trail {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    margin: 0 0 1.75rem;
    overflow-x: auto;
    padding: 0.25rem 0.1rem;
  }
  .trail-step {
    flex: 1 1 0;
    min-width: 6px;
    height: 6px;
    border-radius: 3px;
    background: var(--surface-2);
    transition: background 0.25s ease;
  }
  .trail-step.done { background: var(--contour); }
  .trail-step.correct { background: var(--correct); }
  .trail-step.incorrect { background: var(--incorrect); }
  .trail-step.current { background: var(--accent); }

  .progress-label {
    font-size: 0.75rem;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.03em;
    margin-bottom: 0.5rem;
  }

  /* ---- cards ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.75rem;
    box-shadow: var(--shadow);
  }

  .card + .card { margin-top: 1rem; }

  .eyebrow {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 0.6rem;
  }

  .q-text {
    font-size: 1.0625rem;
    font-weight: 500;
    text-wrap: balance;
    margin: 0 0 0.4rem;
    white-space: pre-wrap;
  }

  .q-limit {
    font-size: 0.8125rem;
    color: var(--ink-faint);
    margin: 0 0 1.1rem;
  }

  textarea {
    width: 100%;
    min-height: 5.5rem;
    resize: vertical;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.85rem 0.95rem;
    font: inherit;
    font-size: 1rem;
    line-height: 1.6;
  }
  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }

  .char-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 0.4rem;
    font-size: 0.8rem;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .char-row.over { color: var(--incorrect); font-weight: 700; }

  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.6rem;
    margin-top: 1.25rem;
  }

  button {
    font: inherit;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    padding: 0.65rem 1.4rem;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease, opacity 0.15s ease;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .btn-primary:hover:not(:disabled) { opacity: 0.92; }

  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--surface-2); }

  /* ---- verdict ---- */
  .verdict-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.8125rem;
    font-weight: 700;
    padding: 0.3rem 0.75rem;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .pill-correct { background: var(--correct-soft); color: var(--correct); }
  .pill-incorrect { background: var(--incorrect-soft); color: var(--incorrect); }

  .answer-block {
    background: var(--surface-2);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    margin-top: 0.9rem;
  }
  .answer-block .label {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    margin: 0 0 0.3rem;
  }
  .answer-block .value {
    margin: 0;
    font-size: 0.95rem;
  }
  .your-answer { color: var(--ink-soft); }

  .override-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1.1rem;
    font-size: 0.8125rem;
    color: var(--ink-faint);
  }
  .override-row .btn-toggle {
    font-size: 0.8rem;
    padding: 0.4rem 0.85rem;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-soft);
  }
  .override-row .btn-toggle.active-correct {
    background: var(--correct-soft); color: var(--correct); border-color: transparent;
  }
  .override-row .btn-toggle.active-incorrect {
    background: var(--incorrect-soft); color: var(--incorrect); border-color: transparent;
  }

  /* ---- intro / result screens ---- */
  .hero-eyebrow {
    font-size: 0.8125rem;
    color: var(--contour);
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .hero-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.9rem;
    font-weight: 700;
    margin: 0.4rem 0 0.9rem;
    text-wrap: balance;
  }
  .hero-desc { color: var(--ink-soft); font-size: 0.98rem; margin: 0 0 1.4rem; }
  .rule-list { margin: 0 0 1.6rem; padding: 0; list-style: none; display: grid; gap: 0.6rem; }
  .rule-list li {
    display: flex;
    gap: 0.7rem;
    align-items: flex-start;
    font-size: 0.92rem;
    color: var(--ink-soft);
  }
  .rule-mark {
    flex: none;
    width: 1.5rem; height: 1.5rem;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 700;
  }

  .score-hero {
    text-align: center;
    padding: 1rem 0 0.5rem;
  }
  .score-num {
    font-family: 'Shippori Mincho', serif;
    font-size: 3.4rem;
    font-weight: 700;
    color: var(--contour);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .score-num span { font-size: 1.4rem; color: var(--ink-faint); font-family: 'Zen Kaku Gothic New', sans-serif; }
  .score-caption { color: var(--ink-soft); font-size: 0.9rem; margin-top: 0.5rem; }

  .review-list { margin-top: 1.5rem; display: grid; gap: 0.6rem; }
  .review-item {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface);
  }
  .review-item summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.85rem 1rem;
    font-size: 0.9rem;
  }
  .review-item summary::-webkit-details-marker { display: none; }
  .review-item summary .qnum {
    font-variant-numeric: tabular-nums;
    color: var(--ink-faint);
    font-size: 0.8rem;
    flex: none;
    width: 1.6rem;
  }
  .review-item summary .qpreview {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--ink);
  }
  .review-item .dot {
    flex: none;
    width: 8px; height: 8px; border-radius: 50%;
  }
  .dot.correct { background: var(--correct); }
  .dot.incorrect { background: var(--incorrect); }
  .review-item .review-body {
    padding: 0 1rem 1rem;
    border-top: 1px solid var(--border);
    padding-top: 0.9rem;
  }

  .final-actions {
    display: flex;
    justify-content: center;
    margin-top: 1.75rem;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .fade-in { animation: fadeIn 0.28s ease both; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<div class="page">

</div>

    },
    {
      q: "紀伊山地は林業がさかんです。伐採した木材を運び出すために、かつてはどのように運んでいましたか。",
      model: "木材をいかだに組み、川に流して河口まで運んだ。",
      groups: [
        ["いかだ"],
        ["川", "流し", "流して"]
      ]
    }
  ];

  var STORAGE_KEY = "chiri-kijutsu-drill-v1";

  function countChars(s) {
    return Array.from(s.trim()).length;
  }

  function normalize(s) {
    return s.replace(/\s+/g, "");
  }

  function judge(q, answerRaw) {
    var answer = normalize(answerRaw);
    if (!answer) return false;
    for (var i = 0; i < q.groups.length; i++) {
      var group = q.groups[i];
      var hit = group.some(function (kw) { return answer.indexOf(kw) !== -1; });
      if (q.groupMode === "any") {
        if (hit) return true;
      } else {
        if (!hit) return false;
      }
    }
    return q.groupMode === "any" ? false : true;
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.answers) || parsed.answers.length !== QUESTIONS.length) return null;
      return parsed;
    } catch (e) { return null; }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* ignore */ }
  }

  function clearState() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
  }

  var saved = loadState();
  var state = saved || {
    screen: "intro", // intro | question | result
    index: 0,
    answers: QUESTIONS.map(function () {
      return { text: "", submitted: false, auto: null, final: null };
    })
  };

  var app = document.getElementById("app");
  var mastheadSub = document.getElementById("masthead-sub");

  function render() {
    if (state.screen === "intro") {
      mastheadSub.textContent = "中学受験 社会";
      renderIntro();
    } else if (state.screen === "question") {
      var doneCount = state.answers.filter(function (a) { return a.submitted; }).length;
      mastheadSub.textContent = "第 " + (state.index + 1) + " 問 / 全 " + QUESTIONS.length + " 問";
      renderQuestion();
    } else {
      mastheadSub.textContent = "結果";
      renderResult();
    }
  }

  function trailHTML() {
    var steps = QUESTIONS.map(function (_, i) {
      var a = state.answers[i];
      var cls = "trail-step";
      if (i === state.index && state.screen === "question") cls += " current";
      else if (a.submitted) cls += a.final ? " correct" : " incorrect";
      return '<div class="' + cls + '"></div>';
    }).join("");
    return '<div class="trail" aria-hidden="true">' + steps + '</div>';
  }

  function renderIntro() {
    app.innerHTML =
      '<div class="card fade-in">' +
        '<p class="hero-eyebrow">GEOGRAPHY · 記述問題対策</p>' +
        '<h2 class="hero-title">1問ずつ、自分の言葉で答えてみよう</h2>' +
        '<p class="hero-desc">地理分野の記述問題を' + QUESTIONS.length + '問、順番に出題します。模範解答と完全一致しなくても、重要なキーワードが入っていれば正解と判定します。</p>' +
        '<ul class="rule-list">' +
          '<li><span class="rule-mark">1</span><span>字数制限がある問題は、入力欄の下に文字数が表示されます。</span></li>' +
          '<li><span class="rule-mark">2</span><span>採点はキーワードの自動判定です。「惜しいのに不正解になった」という時は、ご自身で判定を上書きできます。</span></li>' +
          '<li><span class="rule-mark">3</span><span>進行状況は自動で保存されます。途中で閉じても続きから再開できます。</span></li>' +
        '</ul>' +
        '<div class="actions" style="justify-content:flex-start">' +
          '<button class="btn-primary" id="start-btn">' + (saved && saved.screen !== "intro" ? "続きから再開する" : "はじめる") + '</button>' +
          (saved ? '<button class="btn-ghost" id="restart-fresh-btn">最初から始める</button>' : '') +
        '</div>' +
      '</div>';

    document.getElementById("start-btn").addEventListener("click", function () {
      if (!(saved && saved.screen !== "intro")) {
        state.screen = "question";
        state.index = 0;
      } else {
        state.screen = saved.screen;
        state.index = saved.index;
      }
      saveState();
      render();
    });
    var freshBtn = document.getElementById("restart-fresh-btn");
    if (freshBtn) {
      freshBtn.addEventListener("click", function () {
        resetAll();
      });
    }
  }

  function resetAll() {
    clearState();
    state = {
      screen: "question",
      index: 0,
      answers: QUESTIONS.map(function () {
        return { text: "", submitted: false, auto: null, final: null };
      })
    };
    saved = null;
    render();
  }

  function renderQuestion() {
    var i = state.index;
    var q = QUESTIONS[i];
    var a = state.answers[i];

    var html = trailHTML();
    html += '<div class="progress-label">' + (i + 1) + ' / ' + QUESTIONS.length + '</div>';
    html += '<div class="card fade-in" aria-live="polite">';
    html += '<p class="eyebrow">Q' + (i + 1) + '</p>';
    html += '<p class="q-text">' + escapeHTML(q.q) + '</p>';
    if (q.limit) {
      html += '<p class="q-limit">' + q.limit + '字以内で答えなさい。</p>';
    }

    if (!a.submitted) {
      html += '<textarea id="answer-input" placeholder="ここに解答を入力" aria-label="解答入力">' + escapeHTML(a.text) + '</textarea>';
      html += '<div class="char-row" id="char-row"></div>';
      html += '<div class="actions">';
      if (i > 0) html += '<button class="btn-ghost" id="back-btn">戻る</button>';
      html += '<button class="btn-primary" id="submit-btn">こたえる</button>';
      html += '</div>';
    } else {
      html += renderFeedback(q, a);
    }
    html += '</div>';

    app.innerHTML = html;

    if (!a.submitted) {
      var textarea = document.getElementById("answer-input");
      var charRow = document.getElementById("char-row");
      var submitBtn = document.getElementById("submit-btn");

      function updateChar() {
        var n = countChars(textarea.value);
        if (q.limit) {
          charRow.textContent = n + " / " + q.limit + " 字";
          charRow.className = "char-row" + (n > q.limit ? " over" : "");
        } else {
          charRow.textContent = n + " 字";
        }
      }
      textarea.addEventListener("input", updateChar);
      updateChar();
      textarea.focus();

      submitBtn.addEventListener("click", function () {
        var text = textarea.value;
        a.text = text;
        var result = judge(q, text);
        a.auto = result;
        a.final = result;
        a.submitted = true;
        saveState();
        render();
      });

      var backBtn = document.getElementById("back-btn");
      if (backBtn) {
        backBtn.addEventListener("click", function () {
          state.index = Math.max(0, state.index - 1);
          saveState();
          render();
        });
      }
    } else {
      wireFeedbackButtons(q, a);
    }
  }

  function renderFeedback(q, a) {
    var html = '<div class="fade-in">';
    html += '<div class="verdict-row">';
    html += a.final
      ? '<span class="pill pill-correct">● 正解</span>'
      : '<span class="pill pill-incorrect">○ 不正解</span>';
    html += '</div>';

    html += '<div class="answer-block">';
    html += '<p class="label">あなたの解答</p>';
    html += '<p class="value your-answer">' + (a.text.trim() ? escapeHTML(a.text) : "（無回答）") + '</p>';
    html += '</div>';

    html += '<div class="answer-block">';
    html += '<p class="label">模範解答</p>';
    html += '<p class="value">' + escapeHTML(q.model) + '</p>';
    html += '</div>';

    html += '<div class="override-row">';
    html += '<span>判定を修正する：</span>';
    html += '<button class="btn-toggle' + (a.final ? ' active-correct' : '') + '" id="mark-correct-btn" type="button">正解にする</button>';
    html += '<button class="btn-toggle' + (!a.final ? ' active-incorrect' : '') + '" id="mark-incorrect-btn" type="button">不正解にする</button>';
    html += '</div>';

    html += '<div class="actions">';
    html += '<button class="btn-ghost" id="redo-btn">もう一度入力する</button>';
    html += '<button class="btn-primary" id="next-btn">' + (state.index === QUESTIONS.length - 1 ? "結果を見る" : "次へ") + '</button>';
    html += '</div>';
    html += '</div>';
    return html;
  }

  function wireFeedbackButtons(q, a) {
    document.getElementById("mark-correct-btn").addEventListener("click", function () {
      a.final = true;
      saveState();
      render();
    });
    document.getElementById("mark-incorrect-btn").addEventListener("click", function () {
      a.final = false;
      saveState();
      render();
    });
    document.getElementById("redo-btn").addEventListener("click", function () {
      a.submitted = false;
      a.auto = null;
      a.final = null;
      saveState();
      render();
    });
    document.getElementById("next-btn").addEventListener("click", function () {
      if (state.index < QUESTIONS.length - 1) {
        state.index += 1;
        saveState();
        render();
      } else {
        state.screen = "result";
        saveState();
        render();
      }
    });
  }

  function renderResult() {
    var correctCount = state.answers.filter(function (a) { return a.final; }).length;
    var html = '<div class="card fade-in">';
    html += '<div class="score-hero">';
    html += '<p class="hero-eyebrow">RESULT</p>';
    html += '<div class="score-num">' + correctCount + '<span> / ' + QUESTIONS.length + ' 問正解</span></div>';
    html += '<p class="score-caption">' + resultCaption(correctCount) + '</p>';
    html += '</div>';

    html += '<div class="review-list">';
    QUESTIONS.forEach(function (q, i) {
      var a = state.answers[i];
      html += '<details class="review-item">';
      html += '<summary>';
      html += '<span class="qnum">Q' + (i + 1) + '</span>';
      html += '<span class="dot ' + (a.final ? 'correct' : 'incorrect') + '"></span>';
      html += '<span class="qpreview">' + escapeHTML(q.q) + '</span>';
      html += '</summary>';
      html += '<div class="review-body">';
      html += '<div class="answer-block"><p class="label">あなたの解答</p><p class="value your-answer">' + (a.text.trim() ? escapeHTML(a.text) : "（無回答）") + '</p></div>';
      html += '<div class="answer-block"><p class="label">模範解答</p><p class="value">' + escapeHTML(q.model) + '</p></div>';
      html += '</div>';
      html += '</details>';
    });
    html += '</div>';

    html += '<div class="final-actions"><button class="btn-primary" id="restart-btn">もう一度挑戦する</button></div>';
    html += '</div>';

    app.innerHTML = html;
    document.getElementById("restart-btn").addEventListener("click", resetAll);
  }

  function resultCaption(n) {
    var total = QUESTIONS.length;
    var ratio = n / total;
    if (ratio === 1) return "全問正解です！この調子で進めましょう。";
    if (ratio >= 0.8) return "よくできました。間違えた問題を見直しておきましょう。";
    if (ratio >= 0.5) return "もう少しです。模範解答と見比べて復習しましょう。";
    return "これから伸びます。模範解答を読んでもう一度挑戦してみましょう。";
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  render();
})();
</script>
